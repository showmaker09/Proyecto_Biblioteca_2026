<svg viewBox="0 0 220 276" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tapa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222222" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#090909" />
    </linearGradient>
    <linearGradient id="lomo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="32%" stop-color="#2C2C2C" />
      <stop offset="68%" stop-color="#171717" />
      <stop offset="100%" stop-color="#040404" />
    </linearGradient>
    <linearGradient id="brillo" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="hojas" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="55%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DDE6FB" />
    </linearGradient>
  </defs>

  <!-- Canto fino de páginas a la derecha -->
  <rect x="205" y="10" width="8" height="256" rx="2" fill="url(#hojas)" />
  <line x1="208" y1="12" x2="208" y2="264" stroke="#94A3B8" stroke-width="0.6" opacity="0.55" />
  <line x1="210.5" y1="12" x2="210.5" y2="264" stroke="#94A3B8" stroke-width="0.6" opacity="0.45" />

  <!-- Cuerpo de tapa dura -->
  <rect x="8" y="6" width="201" height="264" rx="8" fill="url(#tapa)" stroke="#2A2A2A" stroke-width="1" />

  <!-- Lomo clásico redondeado -->
  <path d="M 8 14 C 8 9.5 11.5 6 16 6 L 37 6 L 37 270 L 16 270 C 11.5 270 8 266.5 8 262 Z" fill="url(#lomo)" />

  <!-- Hendidura de bisagra entre lomo y portada -->
  <line x1="37" y1="6" x2="37" y2="270" stroke="#000000" stroke-opacity="0.7" stroke-width="2" />
  <line x1="39.5" y1="7" x2="39.5" y2="269" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1" />

  <!-- 5 nervios horizontales en relieve del lomo clásico -->
  <g>
    <rect x="8" y="48" width="29" height="5" rx="1.5" fill="#2E2E2E" />
    <line x1="9" y1="48.8" x2="36" y2="48.8" stroke="#93C5FD" stroke-opacity="0.45" stroke-width="0.9" />
    <line x1="9" y1="53.2" x2="36" y2="53.2" stroke="#000000" stroke-opacity="0.7" stroke-width="1.2" />

    <rect x="8" y="92" width="29" height="5" rx="1.5" fill="#2E2E2E" />
    <line x1="9" y1="92.8" x2="36" y2="92.8" stroke="#93C5FD" stroke-opacity="0.45" stroke-width="0.9" />
    <line x1="9" y1="97.2" x2="36" y2="97.2" stroke="#000000" stroke-opacity="0.7" stroke-width="1.2" />

    <rect x="8" y="136" width="29" height="5" rx="1.5" fill="#2E2E2E" />
    <line x1="9" y1="136.8" x2="36" y2="136.8" stroke="#93C5FD" stroke-opacity="0.45" stroke-width="0.9" />
    <line x1="9" y1="141.2" x2="36" y2="141.2" stroke="#000000" stroke-opacity="0.7" stroke-width="1.2" />

    <rect x="8" y="180" width="29" height="5" rx="1.5" fill="#2E2E2E" />
    <line x1="9" y1="180.8" x2="36" y2="180.8" stroke="#93C5FD" stroke-opacity="0.45" stroke-width="0.9" />
    <line x1="9" y1="185.2" x2="36" y2="185.2" stroke="#000000" stroke-opacity="0.7" stroke-width="1.2" />

    <rect x="8" y="224" width="29" height="5" rx="1.5" fill="#2E2E2E" />
    <line x1="9" y1="224.8" x2="36" y2="224.8" stroke="#93C5FD" stroke-opacity="0.45" stroke-width="0.9" />
    <line x1="9" y1="229.2" x2="36" y2="229.2" stroke="#000000" stroke-opacity="0.7" stroke-width="1.2" />
  </g>

  <!-- Recuadros ornamentales entre nervios del lomo -->
  <g fill="none" stroke="#93C5FD" stroke-opacity="0.6" stroke-width="1">
    <rect x="13" y="14" width="18" height="28" rx="1.5" />
    <rect x="13" y="59" width="18" height="27" rx="1.5" />
    <rect x="13" y="103" width="18" height="27" rx="1.5" />
    <rect x="13" y="147" width="18" height="27" rx="1.5" />
    <rect x="13" y="191" width="18" height="27" rx="1.5" />
    <rect x="13" y="235" width="18" height="27" rx="1.5" />
  </g>

  <!-- Marco doble clásico con esquinas escotadas y filigranas -->
  <g fill="none" stroke="#93C5FD" stroke-linecap="round" stroke-linejoin="round">
    <rect x="49" y="18" width="146" height="240" rx="2" stroke-width="1.25" opacity="0.82" />
    <path d="M 65 24 L 179 24 A 11 11 0 0 0 190 35 L 190 241 A 11 11 0 0 0 179 252 L 65 252 A 11 11 0 0 0 54 241 L 54 35 A 11 11 0 0 0 65 24 Z"
          stroke-width="1" opacity="0.58" />

    <!-- Filigrana esquina superior izquierda -->
    <path d="M 54 36 C 54 26 60 22 68 23 C 62 27 62 32 67 34 C 61 36 58 39 58 46" stroke-width="1.15" opacity="0.92" />
    <circle cx="62" cy="30" r="2.2" fill="#FFFFFF" stroke="none" opacity="0.9" />

    <!-- Filigrana esquina superior derecha -->
    <path d="M 190 36 C 190 26 184 22 176 23 C 182 27 182 32 177 34 C 183 36 186 39 186 46" stroke-width="1.15" opacity="0.92" />
    <circle cx="182" cy="30" r="2.2" fill="#FFFFFF" stroke="none" opacity="0.9" />

    <!-- Filigrana esquina inferior izquierda -->
    <path d="M 54 240 C 54 250 60 254 68 253 C 62 249 62 244 67 242 C 61 240 58 237 58 230" stroke-width="1.15" opacity="0.92" />
    <circle cx="62" cy="246" r="2.2" fill="#FFFFFF" stroke="none" opacity="0.9" />

    <!-- Filigrana esquina inferior derecha -->
    <path d="M 190 240 C 190 250 184 254 176 253 C 182 249 182 244 177 242 C 183 240 186 237 186 230" stroke-width="1.15" opacity="0.92" />
    <circle cx="182" cy="246" r="2.2" fill="#FFFFFF" stroke="none" opacity="0.9" />
  </g>

  <!-- Medallón editorial clásico en la mitad superior visible -->
  <g fill="none" stroke="#93C5FD">
    <path d="M 92 58 Q 122 50 152 58" stroke-width="1" opacity="0.65" />
    <circle cx="122" cy="54" r="2" fill="#FFFFFF" stroke="none" opacity="0.85" />
    <path d="M 122 68 L 146 98 L 122 128 L 98 98 Z" stroke-width="1.2" opacity="0.85" />
    <path d="M 122 74 L 140 98 L 122 122 L 104 98 Z" stroke-width="0.8" opacity="0.45" />
    <circle cx="122" cy="98" r="10" stroke-width="1.1" opacity="0.9" />
    <circle cx="122" cy="98" r="3.5" fill="#FFFFFF" stroke="none" />
    <path d="M 92 140 Q 122 148 152 140" stroke-width="1" opacity="0.65" />
  </g>

  <!-- Placa tipográfica sutil -->
  <rect x="88" y="156" width="68" height="3.2" rx="1.6" fill="#FFFFFF" opacity="0.85" />
  <rect x="102" y="165" width="40" height="2.4" rx="1.2" fill="#93C5FD" opacity="0.7" />

  <!-- Luz especular diagonal sobre la tapa -->
  <path d="M 38 6 L 148 6 L 82 270 L 38 270 Z" fill="url(#brillo)" />
</svg>
